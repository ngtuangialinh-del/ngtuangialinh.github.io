  <g font-family="Arial, sans-serif">
    <rect x="132" y="470" width="936" height="206" rx="28" fill="#edf2e5"/><text x="180" y="550" fill="#657d36" font-size="25" font-weight="700">SCHOOL SUPPORT</text><text x="180" y="618" fill="#2c381c" font-size="30">Meals, clothing, boots, books, and learning supplies</text>
